<!doctype html>
<!-- Dark-first: Marginalia is designed to read like a notebook at night, so the
     app defaults to the dark theme. Remove this class (or toggle it) to expose
     the light "Paper" theme. -->
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy is set from the main process (see
         src/electron/index.ts) so it can differ between dev and production:
         dev needs 'unsafe-eval' for webpack HMR, production stays strict. -->
    <title>Marginalia</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
